services:
  - type: web
    name: dpdp-shield-api
    env: docker
    region: singapore
    plan: free
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dpdp-db
          property: connectionString
      - key: REDIS_URL
        value: redis://dpdp-redis:6379
      - key: GEMINI_API_KEY
        sync: false

  - type: redis
    name: dpdp-redis
    plan: free
    region: singapore
    ipAllowList: []

databases:
  - name: dpdp-db
    databaseName: dpdp
    user: dpdp_user
    plan: free
    region: singapore
